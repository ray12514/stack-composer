schema_version: 1
workspace:
  role: build
build:
  contexts:
    login:
      node_type: login
      stages:
        - /tmp/hpc-lab-cse/example-cray/login
        - /shared/tests/workspace-init/stages/example-cray/login
    compute:
      node_type: cpu_compute
      stages:
        - /tmp/hpc-lab-cse/example-cray/compute
        - /shared/tests/workspace-init/stages/example-cray/compute
architecture:
  target: x86_64_v2
  binary_target: x86_64
  node_types: [login, cpu_compute]
system:
  name: example-cray
release: lab
stack:
  name: cse-initial-conversion-trials
shared:
  compiler:
    name: gcc
    version: 14.2.0
    public_name: init-GCC
    source: build
    modules: []
    commands:
      c: gcc
      cxx: g++
      fortran: gfortran
    build_with:
      name: gcc
      version: 13.3.0
      modules: [PrgEnv-gnu, gcc-native/13]
  mpi:
    name: cray-mpich
    version: 8.1.29
    source: external
    modules: [cray-mpich/8.1.29]
    commands:
      c: cc
      cxx: CC
      fortran: ftn
    spec: cray-mpich@8.1.29
    provider_constraint: cray-mpich@8.1.29
    consumer:
      status: multi-node-validation-required
      interface: vendor-wrapper
      wrapper_provider: cray-mpich-simple-wrapper
      prefix: /shared/tests/workspace-init/mock-tools/cray-mpich-gcc
      wrappers:
        c: /shared/tests/workspace-init/mock-tools/cray-mpich-gcc/bin/mpicc
        cxx: /shared/tests/workspace-init/mock-tools/cray-mpich-gcc/bin/mpicxx
        fortran: /shared/tests/workspace-init/mock-tools/cray-mpich-gcc/bin/mpifort
        fortran90: /shared/tests/workspace-init/mock-tools/cray-mpich-gcc/bin/mpif90
        fortran77: /shared/tests/workspace-init/mock-tools/cray-mpich-gcc/bin/mpif77
      runtime_environment:
        prepend_path:
          LD_LIBRARY_PATH:
            - /shared/tests/workspace-init/mock-tools/libfabric/lib64
  catalog_scopes:
    compiler: scopes/compilers/gcc/13.3.0
    mpi: scopes/mpi/cray-mpich/8.1.29/gcc-13.3
platform:
  compiler:
    name: cce
    version: 17.0.1
    public_name: init-CCE
    source: external
    modules: [PrgEnv-cray, cce/17.0.1]
    commands:
      c: cc
      cxx: CC
      fortran: ftn
  mpi:
    name: cray-mpich
    version: 8.1.29
    source: external
    modules: [cray-mpich/8.1.29]
    commands:
      c: cc
      cxx: CC
      fortran: ftn
    spec: cray-mpich@8.1.29
    provider_constraint: cray-mpich@8.1.29
  catalog_scopes:
    compiler: scopes/compilers/cce/17.0.1
    runtime_compiler: null
    mpi: scopes/mpi/cray-mpich/8.1.29/cce-17.0
catalog_scopes:
  common: scopes/common
  platform: null
paths:
  install_tree: /shared/tests/workspace-init/published/example-cray/lab/spack/opt
  source_cache: /shared/tests/workspace-init/cache/source
  misc_cache: /shared/tests/workspace-init/cache/misc
  views_root: /shared/tests/workspace-init/published/example-cray/lab/views
  modules_root: /shared/tests/workspace-init/published/example-cray/lab/modules
buildcache:
  name: hpc-lab-example-cray
  url: file:///shared/tests/workspace-init/buildcache/example-cray/lab
permissions:
  group: hpc
  read: group
  write: group
build_jobs: 2
spack:
  source: https://github.com/spack/spack.git
  version: 1.2.2
  tag: v1.2.2
  commit: 3e19345b6e12f5ff1b874f4059622fc6a1fd804a
  default_mode: shared
  shared_root: /opt/spack
  initial_root: /opt/spack
package_repo:
  git: https://github.com/spack/spack-packages.git
  tag: v2026.06.0
